<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cosmic Quest: Space Exploration Quiz</title>
  <style>
    :root {
      --bg: #f4f6fb;
      --bg-gradient: radial-gradient(circle at 50% 10%, #e0e7ff 0%, #f4f6fb 70%);
      --star-color-1: rgba(99, 102, 241, 0.45);
      --star-color-2: rgba(56, 189, 248, 0.4);
      --star-color-3: rgba(168, 85, 247, 0.35);
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --card-shadow: 0 10px 30px -5px rgba(15, 23, 42, 0.08), 0 4px 12px -2px rgba(15, 23, 42, 0.04);
      --text-main: #0f172a;
      --text-muted: #64748b;
      --accent: #4f46e5;
      --accent-hover: #4338ca;
      --accent-light: #eef2ff;
      --focus-ring: #4f46e5;
      --option-bg: #f8fafc;
      --option-border: #e2e8f0;
      --option-hover: #f1f5f9;
      --correct-bg: #dcfce7;
      --correct-border: #22c55e;
      --correct-text: #14532d;
      --wrong-bg: #fee2e2;
      --wrong-border: #ef4444;
      --wrong-text: #7f1d1d;
      --progress-track: #e2e8f0;
      --progress-fill: linear-gradient(90deg, #6366f1, #38bdf8);
      --badge-bg: #e0e7ff;
      --badge-text: #3730a3;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #070b14;
        --bg-gradient: radial-gradient(circle at 50% 0%, #1e1548 0%, #0c1022 50%, #070b14 100%);
        --star-color-1: rgba(255, 255, 255, 0.7);
        --star-color-2: rgba(147, 197, 253, 0.6);
        --star-color-3: rgba(216, 180, 254, 0.55);
        --card-bg: #111728;
        --card-border: #202b45;
        --card-shadow: 0 16px 40px -10px rgba(0, 0, 0, 0.6), 0 0 25px rgba(99, 102, 241, 0.12);
        --text-main: #f1f5f9;
        --text-muted: #94a3b8;
        --accent: #6366f1;
        --accent-hover: #818cf8;
        --accent-light: #1e1b4b;
        --focus-ring: #818cf8;
        --option-bg: #182035;
        --option-border: #253352;
        --option-hover: #1f2a47;
        --correct-bg: rgba(34, 197, 94, 0.2);
        --correct-border: #22c55e;
        --correct-text: #86efac;
        --wrong-bg: rgba(239, 68, 68, 0.22);
        --wrong-border: #ef4444;
        --wrong-text: #fca5a5;
        --progress-track: #1c263c;
        --progress-fill: linear-gradient(90deg, #818cf8, #38bdf8);
        --badge-bg: rgba(99, 102, 241, 0.2);
        --badge-text: #c7d2fe;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 15px;
      line-height: 1.5;
      color: var(--text-main);
      background: var(--bg);
      background-image: var(--bg-gradient);
      background-attachment: fixed;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 16px;
      position: relative;
      overflow-x: hidden;
    }

    /* Subtle Animated Star-Field Background */
    .starfield {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background-image:
        radial-gradient(1px 1px at 24px 38px, var(--star-color-1), transparent),
        radial-gradient(1.5px 1.5px at 120px 80px, var(--star-color-2), transparent),
        radial-gradient(1px 1px at 210px 180px, var(--star-color-1), transparent),
        radial-gradient(2px 2px at 320px 60px, var(--star-color-3), transparent),
        radial-gradient(1px 1px at 420px 220px, var(--star-color-2), transparent),
        radial-gradient(1.5px 1.5px at 90px 290px, var(--star-color-1), transparent),
        radial-gradient(1px 1px at 280px 340px, var(--star-color-2), transparent),
        radial-gradient(1.5px 1.5px at 380px 410px, var(--star-color-3), transparent),
        radial-gradient(1px 1px at 160px 460px, var(--star-color-1), transparent),
        radial-gradient(2px 2px at 50px 520px, var(--star-color-2), transparent);
      background-repeat: repeat;
      background-size: 450px 550px;
      opacity: 0.65;
      animation: starTwinkle 9s ease-in-out infinite alternate;
    }

    @keyframes starTwinkle {
      0% { opacity: 0.45; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.01); }
      100% { opacity: 0.55; transform: scale(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      .starfield {
        animation: none !important;
        opacity: 0.6;
      }
      .option-btn, .action-btn, .results-emoji, .confetti-particle, .live-dot {
        animation: none !important;
        transition: none !important;
      }
    }

    /* Narrow centered column */
    .quiz-container {
      width: 100%;
      max-width: 480px;
      position: relative;
      z-index: 1;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      box-shadow: var(--card-shadow);
      padding: 28px 24px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      position: relative;
      overflow: hidden;
    }

    /* Mission Control Console Header Bar */
    .top-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      padding: 10px 14px;
      background: var(--option-bg);
      border: 1px solid var(--option-border);
      border-radius: 12px;
      gap: 10px;
    }

    .telemetry-item {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .telemetry-item.align-right {
      align-items: flex-end;
      text-align: right;
    }

    .telemetry-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
      display: inline-block;
      animation: telemetryPulse 2s ease-in-out infinite;
    }

    @keyframes telemetryPulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    .telemetry-val {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 14px;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: baseline;
      gap: 2px;
    }

    .telemetry-total {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .telemetry-divider {
      width: 1px;
      height: 28px;
      background: var(--card-border);
      opacity: 0.7;
    }

    /* Progress bar */
    .progress-track {
      width: 100%;
      height: 8px;
      background: var(--progress-track);
      border-radius: 9999px;
      overflow: hidden;
      margin-bottom: 24px;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--progress-fill);
      border-radius: 9999px;
      transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Question */
    .question-title {
      font-size: 19px;
      font-weight: 700;
      line-height: 1.35;
      color: var(--text-main);
      margin-bottom: 20px;
    }

    /* Options Stack */
    .options-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }

    .option-btn {
      width: 100%;
      display: flex;
      align-items: center;
      text-align: left;
      padding: 14px 16px;
      font-size: 15px;
      font-family: inherit;
      color: var(--text-main);
      background: var(--option-bg);
      border: 1.5px solid var(--option-border);
      border-radius: 14px;
      cursor: pointer;
      transition: background-color 0.18s ease, border-color 0.18s ease, transform 0.15s ease, box-shadow 0.18s ease;
      outline: none;
      user-select: none;
      position: relative;
    }

    .option-btn:hover:not(:disabled) {
      background: var(--option-hover);
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    .option-btn:focus-visible {
      border-color: var(--focus-ring);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.4), 0 0 14px rgba(99, 102, 241, 0.25);
      outline: 2px solid var(--focus-ring);
      outline-offset: 2px;
    }

    .option-prefix {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      border-radius: 8px;
      background: rgba(148, 163, 184, 0.16);
      font-weight: 600;
      font-size: 13px;
      margin-right: 12px;
      flex-shrink: 0;
      color: var(--text-muted);
      transition: all 0.18s ease;
    }

    .option-text {
      flex: 1;
      font-weight: 500;
    }

    .option-icon {
      font-size: 18px;
      margin-left: 8px;
      display: none;
    }

    /* Animated Feedback states */
    .option-btn.correct {
      background-color: var(--correct-bg) !important;
      border-color: var(--correct-border) !important;
      color: var(--correct-text) !important;
      animation: popCorrect 0.45s ease forwards;
    }

    .option-btn.correct .option-prefix {
      background: var(--correct-border);
      color: #ffffff;
    }

    .option-btn.correct .option-icon {
      display: inline-block;
    }

    .option-btn.wrong {
      background-color: var(--wrong-bg) !important;
      border-color: var(--wrong-border) !important;
      color: var(--wrong-text) !important;
      animation: shakeWrong 0.5s ease forwards;
    }

    .option-btn.wrong .option-prefix {
      background: var(--wrong-border);
      color: #ffffff;
    }

    .option-btn.wrong .option-icon {
      display: inline-block;
    }

    .option-btn.dimmed {
      opacity: 0.55;
    }

    @keyframes popCorrect {
      0% { transform: scale(1); }
      40% { transform: scale(1.025); }
      100% { transform: scale(1); }
    }

    @keyframes shakeWrong {
      0%, 100% { transform: translateX(0); }
      15%, 55%, 85% { transform: translateX(-8px); }
      35%, 75% { transform: translateX(8px); }
    }

    /* Fact / Feedback Banner */
    .feedback-banner {
      display: none;
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 13.5px;
      line-height: 1.45;
      margin-bottom: 18px;
      animation: fadeIn 0.25s ease;
    }

    .feedback-banner.correct-banner {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      background: var(--correct-bg);
      border: 1px solid var(--correct-border);
      color: var(--correct-text);
    }

    .feedback-banner.wrong-banner {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      background: var(--wrong-bg);
      border: 1px solid var(--wrong-border);
      color: var(--wrong-text);
    }

    /* Action Buttons */
    .action-btn {
      width: 100%;
      padding: 14px;
      background: var(--accent);
      color: #ffffff;
      border: none;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background-color 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.35);
    }

    .action-btn:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(99, 102, 241, 0.45);
    }

    .action-btn:active {
      transform: translateY(0);
    }

    .action-btn:focus-visible {
      outline: 3px solid var(--focus-ring);
      outline-offset: 3px;
      box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.4), 0 0 16px rgba(99, 102, 241, 0.3);
    }

    /* Results Screen */
    .results-screen {
      display: none;
      text-align: center;
      animation: fadeIn 0.35s ease;
      position: relative;
    }

    /* Celebratory Gold/Cosmic Glow for High Scores (>=8) */
    .results-screen.celebration-mode {
      border: 1px solid rgba(251, 191, 36, 0.5);
      box-shadow: 0 20px 45px -10px rgba(245, 158, 11, 0.25), 0 0 30px rgba(251, 191, 36, 0.2);
    }

    .results-screen.celebration-mode .score-circle {
      border-color: #f59e0b;
      box-shadow: 0 0 35px rgba(245, 158, 11, 0.45);
      animation: celebrationPulse 2s ease-in-out infinite alternate;
    }

    .celebration-banner {
      display: none;
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.2), rgba(236, 72, 153, 0.2));
      border: 1px solid rgba(245, 158, 11, 0.4);
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin: 0 auto 12px;
      width: fit-content;
      animation: fadeIn 0.4s ease;
    }

    .celebration-mode .celebration-banner {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    @keyframes celebrationPulse {
      0% { transform: scale(1); box-shadow: 0 0 25px rgba(245, 158, 11, 0.35); }
      100% { transform: scale(1.04); box-shadow: 0 0 40px rgba(245, 158, 11, 0.65); }
    }

    /* Confetti Particle Layer */
    .confetti-container {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      border-radius: 20px;
    }

    .confetti-particle {
      position: absolute;
      width: 7px;
      height: 7px;
      border-radius: 2px;
      opacity: 0.9;
      animation: confettiFall 3s cubic-bezier(0.25, 1, 0.5, 1) infinite;
    }

    @keyframes confettiFall {
      0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
      100% { transform: translateY(520px) rotate(720deg); opacity: 0; }
    }

    .results-emoji {
      font-size: 64px;
      line-height: 1;
      margin: 12px 0 16px;
      display: inline-block;
      animation: floatEmoji 2.5s ease-in-out infinite alternate;
    }

    @keyframes floatEmoji {
      0% { transform: translateY(0) scale(1); }
      100% { transform: translateY(-8px) scale(1.05); }
    }

    .results-title {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 6px;
      color: var(--text-main);
    }

    .results-subtitle {
      color: var(--text-muted);
      font-size: 14px;
      margin-bottom: 24px;
    }

    .score-circle {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 140px;
      height: 140px;
      margin: 0 auto 24px;
      border-radius: 50%;
      background: var(--option-bg);
      border: 3px solid var(--accent);
      box-shadow: 0 0 25px rgba(99, 102, 241, 0.2);
    }

    .score-big {
      font-size: 38px;
      font-weight: 800;
      color: var(--text-main);
      line-height: 1;
    }

    .score-total {
      font-size: 14px;
      color: var(--text-muted);
      font-weight: 600;
      margin-top: 4px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 24px;
    }

    .stat-box {
      background: var(--option-bg);
      border: 1px solid var(--option-border);
      border-radius: 12px;
      padding: 12px;
      text-align: center;
    }

    .stat-label {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 500;
      margin-bottom: 2px;
    }

    .stat-value {
      font-size: 17px;
      font-weight: 700;
      color: var(--text-main);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .subtle-credit {
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 16px;
      letter-spacing: 0.02em;
    }
  </style>
</head>
<body>
  <div class="starfield" aria-hidden="true"></div>

  <div class="quiz-container">
    <!-- Active Quiz Card -->
    <div class="card" id="quizCard">
      <!-- Mission Control Telemetry Header -->
      <div class="top-meta" role="region" aria-label="Mission Telemetry">
        <div class="telemetry-item">
          <div class="telemetry-label">
            <span class="live-dot" aria-hidden="true"></span>
            <span>Mission Stage</span>
          </div>
          <div class="telemetry-val">
            <span id="stageCurrent">01</span><span class="telemetry-total">/10</span>
          </div>
        </div>

        <div class="telemetry-divider" aria-hidden="true"></div>

        <div class="telemetry-item align-right">
          <div class="telemetry-label">Telemetry Score</div>
          <div class="telemetry-val">
            <span id="scoreCounter">00</span><span class="telemetry-total">&nbsp;PTS</span>
          </div>
        </div>
      </div>

      <!-- Progress bar -->
      <div class="progress-track">
        <div class="progress-fill" id="progressBar"></div>
      </div>

      <!-- Question -->
      <h2 class="question-title" id="questionText">Loading question...</h2>

      <!-- Options -->
      <div class="options-list" id="optionsContainer"></div>

      <!-- Feedback / Fact Banner -->
      <div class="feedback-banner" id="feedbackBanner">
        <span id="feedbackIcon">✨</span>
        <span id="feedbackText"></span>
      </div>

      <!-- Next Button (revealed after answering) -->
      <button class="action-btn" id="nextBtn" style="display: none;" onclick="handleNextClick()">
        <span>Next Question</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </button>
    </div>

    <!-- Results Card -->
    <div class="card results-screen" id="resultsCard">
      <div class="confetti-container" id="confettiContainer" aria-hidden="true"></div>
      <div class="celebration-banner" id="celebrationBanner">✦ Outstanding Mission Accomplished ✦</div>
      <div class="results-emoji" id="resultsEmoji">🌌</div>
      <h2 class="results-title" id="resultsTitle">Mission Complete!</h2>
      <p class="results-subtitle" id="resultsSubtitle">Here is how you navigated the cosmos:</p>

      <div class="score-circle">
        <div class="score-big" id="finalScore">0</div>
        <div class="score-total">out of 10</div>
      </div>

      <div class="stats-grid">
        <div class="stat-box">
          <div class="stat-label">Accuracy</div>
          <div class="stat-value" id="accuracyStat">0%</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Rank</div>
          <div class="stat-value" id="rankStat">Astronaut</div>
        </div>
      </div>

      <button class="action-btn" onclick="restartQuiz()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
        <span>Launch Another Mission</span>
      </button>
    </div>

    <div class="subtle-credit">✦ Cosmic Quest Space Exploration Quiz ✦</div>
  </div>

  <script>
    const quizData = [
      {
        question: "Who was the first human to travel into outer space in 1961?",
        options: ["Neil Armstrong", "Yuri Gagarin", "Alan Shepard", "John Glenn"],
        correct: 1,
        fact: "Yuri Gagarin completed a 108-minute orbital flight aboard Vostok 1 on April 12, 1961."
      },
      {
        question: "In what year did Apollo 11 make humanity's first lunar landing?",
        options: ["1965", "1969", "1971", "1973"],
        correct: 1,
        fact: "Neil Armstrong and Buzz Aldrin landed the Eagle lunar module on the Moon on July 20, 1969."
      },
      {
        question: "Which NASA rover landed on Mars in 2021 carrying the Ingenuity helicopter?",
        options: ["Curiosity", "Opportunity", "Perseverance", "Spirit"],
        correct: 2,
        fact: "Perseverance touched down in Jezero Crater to search for signs of ancient microscopic life."
      },
      {
        question: "Which spacecraft is the farthest human-made object from Earth?",
        options: ["Voyager 1", "Voyager 2", "New Horizons", "Pioneer 10"],
        correct: 0,
        fact: "Launched in 1977, Voyager 1 is over 24 billion kilometers (15 billion miles) from Earth in interstellar space."
      },
      {
        question: "What is the name of the premier space telescope launched on Christmas Day 2021?",
        options: ["Hubble", "James Webb", "Spitzer", "Kepler"],
        correct: 1,
        fact: "The James Webb Space Telescope observes the universe in high-resolution infrared from the Sun-Earth L2 Lagrange point."
      },
      {
        question: "What was the name of Earth's first artificial satellite, launched in 1957?",
        options: ["Explorer 1", "Vanguard 1", "Sputnik 1", "Telstar"],
        correct: 2,
        fact: "Sputnik 1 orbited Earth for three weeks, beeping radio signals and initiating the Space Age."
      },
      {
        question: "Which moon of Saturn has dense atmosphere and lakes of liquid methane?",
        options: ["Titan", "Enceladus", "Europa", "Ganymede"],
        correct: 0,
        fact: "Titan is the only moon in the solar system known to have a substantial atmosphere and surface liquid cycles."
      },
      {
        question: "What astronomical term defines the point of no return surrounding a black hole?",
        options: ["Accretion Disk", "Singularity", "Photon Sphere", "Event Horizon"],
        correct: 3,
        fact: "At the event horizon, gravitational pull is so extreme that even light cannot escape."
      },
      {
        question: "What is the name of NASA's program aimed at returning humans to the Moon?",
        options: ["Apollo Next", "Artemis", "Orion Initiative", "Ares"],
        correct: 1,
        fact: "The Artemis program aims to land the first woman and person of color on the Moon and establish a sustainable presence."
      },
      {
        question: "Approximately how long does sunlight take to travel from the Sun to Earth?",
        options: ["8 minutes and 20 seconds", "45 seconds", "18 minutes", "1 hour and 12 minutes"],
        correct: 0,
        fact: "Traveling at ~300,000 km/s across 150 million kilometers, photons take roughly 8 minutes and 20 seconds."
      }
    ];

    let currentQuestionIndex = 0;
    let score = 0;
    let hasAnswered = false;

    const stageCurrent = document.getElementById("stageCurrent");
    const scoreCounter = document.getElementById("scoreCounter");
    const progressBar = document.getElementById("progressBar");
    const questionText = document.getElementById("questionText");
    const optionsContainer = document.getElementById("optionsContainer");
    const feedbackBanner = document.getElementById("feedbackBanner");
    const feedbackIcon = document.getElementById("feedbackIcon");
    const feedbackText = document.getElementById("feedbackText");
    const nextBtn = document.getElementById("nextBtn");

    const quizCard = document.getElementById("quizCard");
    const resultsCard = document.getElementById("resultsCard");
    const resultsEmoji = document.getElementById("resultsEmoji");
    const resultsTitle = document.getElementById("resultsTitle");
    const resultsSubtitle = document.getElementById("resultsSubtitle");
    const finalScore = document.getElementById("finalScore");
    const accuracyStat = document.getElementById("accuracyStat");
    const rankStat = document.getElementById("rankStat");

    const confettiContainer = document.getElementById("confettiContainer");
    const celebrationBanner = document.getElementById("celebrationBanner");

    const optionLetters = ["A", "B", "C", "D"];

    function loadQuestion() {
      hasAnswered = false;
      const q = quizData[currentQuestionIndex];

      // Update header & progress
      const stageNum = String(currentQuestionIndex + 1).padStart(2, '0');
      stageCurrent.textContent = stageNum;
      scoreCounter.textContent = String(score).padStart(2, '0');
      const progressPercent = ((currentQuestionIndex) / quizData.length) * 100;
      progressBar.style.width = `${progressPercent}%`;

      // Update question text
      questionText.textContent = q.question;

      // Reset feedback and action button
      feedbackBanner.className = "feedback-banner";
      feedbackBanner.style.display = "none";
      nextBtn.style.display = "none";

      // Render options
      optionsContainer.innerHTML = "";
      q.options.forEach((opt, idx) => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.setAttribute("type", "button");
        btn.setAttribute("aria-label", `Option ${optionLetters[idx]}: ${opt}`);

        btn.innerHTML = `
          <span class="option-prefix">${optionLetters[idx]}</span>
          <span class="option-text">${opt}</span>
          <span class="option-icon" aria-hidden="true"></span>
        `;

        btn.addEventListener("click", () => handleOptionSelect(idx, btn));
        optionsContainer.appendChild(btn);
      });
    }

    function handleOptionSelect(selectedIndex, selectedBtn) {
      if (hasAnswered) return;
      hasAnswered = true;

      const q = quizData[currentQuestionIndex];
      const isCorrect = selectedIndex === q.correct;
      const optionButtons = optionsContainer.querySelectorAll(".option-btn");

      // Disable all options
      optionButtons.forEach(btn => {
        btn.disabled = true;
      });

      if (isCorrect) {
        score++;
        scoreCounter.textContent = String(score).padStart(2, '0');
        selectedBtn.classList.add("correct");
        selectedBtn.querySelector(".option-icon").textContent = "✓";

        // Feedback Banner
        feedbackIcon.textContent = "🎉";
        feedbackText.innerHTML = `<strong>Correct!</strong> ${q.fact}`;
        feedbackBanner.className = "feedback-banner correct-banner";
        feedbackBanner.style.display = "flex";
      } else {
        selectedBtn.classList.add("wrong");
        selectedBtn.querySelector(".option-icon").textContent = "✕";

        // Highlight correct option
        const correctBtn = optionButtons[q.correct];
        if (correctBtn) {
          correctBtn.classList.add("correct");
          correctBtn.querySelector(".option-icon").textContent = "✓";
        }

        // Feedback Banner
        feedbackIcon.textContent = "🪐";
        feedbackText.innerHTML = `<strong>Not quite!</strong> ${q.fact}`;
        feedbackBanner.className = "feedback-banner wrong-banner";
        feedbackBanner.style.display = "flex";
      }

      // Dim non-selected wrong buttons
      optionButtons.forEach((btn, idx) => {
        if (idx !== selectedIndex && idx !== q.correct) {
          btn.classList.add("dimmed");
        }
      });

      // Update progress bar to include current answer
      const updatedProgress = ((currentQuestionIndex + 1) / quizData.length) * 100;
      progressBar.style.width = `${updatedProgress}%`;

      // Show next button
      if (currentQuestionIndex < quizData.length - 1) {
        nextBtn.querySelector("span").textContent = "Next Question";
      } else {
        nextBtn.querySelector("span").textContent = "View Results";
      }
      nextBtn.style.display = "flex";
      nextBtn.focus();
    }

    function handleNextClick() {
      currentQuestionIndex++;
      if (currentQuestionIndex < quizData.length) {
        loadQuestion();
      } else {
        showResults();
      }
    }

    function showResults() {
      quizCard.style.display = "none";
      resultsCard.style.display = "block";

      finalScore.textContent = score;
      const accuracy = Math.round((score / quizData.length) * 100);
      accuracyStat.textContent = `${accuracy}%`;

      // Celebration effect for score >= 8
      if (score >= 8) {
        resultsCard.classList.add("celebration-mode");
        renderConfetti();
      } else {
        resultsCard.classList.remove("celebration-mode");
        confettiContainer.innerHTML = "";
      }

      // Emoji and tier breakdown
      let emoji = "🚀";
      let title = "Stellar Performance!";
      let subtitle = "You truly know your way around the cosmos.";
      let rank = "Commander";

      if (score === 10) {
        emoji = "👑";
        title = "Galactic Legend!";
        subtitle = "A flawless 10/10 mission! NASA should give you a call.";
        rank = "Grand Cosmic Master";
      } else if (score >= 8) {
        emoji = "🧑‍🚀";
        title = "Veteran Astronaut!";
        subtitle = "Impressive depth of space exploration knowledge!";
        rank = "Flight Commander";
      } else if (score >= 5) {
        emoji = "🛰️";
        title = "Orbital Explorer!";
        subtitle = "Good grasp of the basics, with room to explore deeper space.";
        rank = "Mission Specialist";
      } else {
        emoji = "☄️";
        title = "Rookie Cadet!";
        subtitle = "The cosmos is vast—review your flight manual and launch again!";
        rank = "Space Cadet";
      }

      resultsEmoji.textContent = emoji;
      resultsTitle.textContent = title;
      resultsSubtitle.textContent = subtitle;
      rankStat.textContent = rank;
    }

    function renderConfetti() {
      confettiContainer.innerHTML = "";
      // Skip if user prefers reduced motion
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        return;
      }
      const colors = ["#f59e0b", "#6366f1", "#38bdf8", "#ec4899", "#10b981", "#a855f7"];
      for (let i = 0; i < 28; i++) {
        const p = document.createElement("div");
        p.className = "confetti-particle";
        p.style.left = `${Math.random() * 100}%`;
        p.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        p.style.animationDelay = `${Math.random() * 2.2}s`;
        p.style.animationDuration = `${2.4 + Math.random() * 1.6}s`;
        confettiContainer.appendChild(p);
      }
    }

    function restartQuiz() {
      currentQuestionIndex = 0;
      score = 0;
      resultsCard.classList.remove("celebration-mode");
      confettiContainer.innerHTML = "";
      resultsCard.style.display = "none";
      quizCard.style.display = "block";
      loadQuestion();
    }

    // Keyboard support: 1-4 or A-D for options, Enter for next button
    document.addEventListener("keydown", (e) => {
      if (resultsCard.style.display === "block") {
        if (e.key === "Enter") {
          restartQuiz();
        }
        return;
      }

      if (!hasAnswered) {
        const key = e.key.toUpperCase();
        let targetIndex = -1;
        if (key === "1" || key === "A") targetIndex = 0;
        if (key === "2" || key === "B") targetIndex = 1;
        if (key === "3" || key === "C") targetIndex = 2;
        if (key === "4" || key === "D") targetIndex = 3;

        if (targetIndex >= 0 && targetIndex < 4) {
          const btns = optionsContainer.querySelectorAll(".option-btn");
          if (btns[targetIndex]) {
            btns[targetIndex].click();
          }
        }
      } else {
        if (e.key === "Enter" && nextBtn.style.display !== "none") {
          handleNextClick();
        }
      }
    });

    // Initial load
    loadQuestion();
  </script>
</body>
</html>
